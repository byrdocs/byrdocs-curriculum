name: Check PR
on:
  pull_request_target:
    paths:
      - curricula.yaml
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i
      - run: npm run build
        env:
          CURRICULUM_FILE_URL: ${{ vars.CURRICULUM_FILE_URL }}
          CURRICULUM_SITE_URL: ${{ vars.CURRICULUM_SITE_URL }}
